name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report! Please be as specific as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do you trigger this bug?
      placeholder: |
        1. Open the app
        2. Tap '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant Metro, Xcode console, or adb logcat output.
      render: shell

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. iPhone 15 Pro, iOS 17.4"
    validations:
      required: true

  - type: input
    id: expo-version
    attributes:
      label: Expo SDK Version
      placeholder: "e.g. 57.0.22 (run: pnpm expo --version)"
    validations:
      required: true

  - type: dropdown
    id: build-type
    attributes:
      label: Build Type
      options:
        - Development build (EAS)
        - Local native build (pnpm ios / android)
        - Preview build (EAS internal)
        - Production build
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have reproduced this on a real device (not just a simulator)
